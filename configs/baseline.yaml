# Phase 6 baseline federated learning configuration

seed: 42

model:
  name: simple_cnn
  num_classes: 10
  dropout_rate: 0.5

data:
  dataset_name: mnist
  data_root: ./data
  download: true
  num_clients: 20
  partition_strategy: iid
  test_batch_size: 256
  num_workers: 0

federated:
  num_rounds: 5
  clients_per_round: 5
  device: cpu

training:
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
  criterion: cross_entropy
  verbose: false

communication:
  compression_enabled: true
  precision: float16
  quantization_enabled: false
  sparsification_enabled: true
  sparsity_ratio: 0.3

evaluation:
  frequency: 1

privacy:
  privacy_enabled: false
  clip_norm: 1.0
  noise_multiplier: 0.05
  secure_aggregation_enabled: false

selection:
  strategy: dynamic # random | dynamic
  dynamic:
    weights:
      accuracy: 0.35
      data_size: 0.20
      reliability: 0.20
      latency: 0.15
      resource: 0.05
      participation_boost: 0.05
    policy:
      name: hybrid
      mode: hybrid # top_k | probabilistic | hybrid
      exploration_rate: 0.20
      min_exploration_clients: 1
      fairness_boost_weight: 0.15
      max_skip_rounds: 5
      enforce_max_skip: true
      probabilistic_temperature: 1.0
