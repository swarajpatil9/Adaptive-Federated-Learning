# Phase 6 baseline federated learning configuration

seed: 42

model:
  name: simple_cnn
  num_classes: 10
  dropout_rate: 0.5

data:
  dataset_name: mnist
  data_root: ./data
  download: true
  num_clients: 20
  partition_strategy: iid
  test_batch_size: 256
  num_workers: 0

federated:
  num_rounds: 5
  clients_per_round: 5
  device: cpu

training:
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.001
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
  criterion: cross_entropy
  verbose: false

optimization:
  adaptive_lr:
    enabled: true
    initial_lr: 0.001
    min_lr: 0.0001
    max_lr: 0.01
    decay_factor: 0.95
    slow_decay_factor: 0.98
    plateau_decay_factor: 0.90
    smoothing_factor: 0.2
    min_decay_per_round: 0.0
    max_decay_per_round: 0.20
    loss_improvement_threshold: 0.01
    plateau_threshold: 0.01
    accuracy_improvement_threshold: 0.001
    instability_std_threshold: 0.02
    window_size: 3

evaluation:
  frequency: 1

privacy:
  privacy_enabled: false
  clip_norm: 1.0
  noise_multiplier: 0.05
  secure_aggregation_enabled: false

selection:
  strategy: dynamic # random | dynamic
  dynamic:
    weights:
      accuracy: 0.35
      data_size: 0.20
      reliability: 0.20
      latency: 0.15
      resource: 0.05
      participation_boost: 0.05
    policy:
      name: hybrid
      mode: hybrid # top_k | probabilistic | hybrid
      exploration_rate: 0.20
      min_exploration_clients: 1
      fairness_boost_weight: 0.15
      max_skip_rounds: 5
      enforce_max_skip: true
      probabilistic_temperature: 1.0
