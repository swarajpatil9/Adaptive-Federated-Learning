# Phase 6 baseline federated learning configuration

seed: 42

model:
  name: simple_cnn
  num_classes: 10
  dropout_rate: 0.5

data:
  dataset_name: mnist
  data_root: ./data
  download: true
  num_clients: 20
  partition_strategy: iid
  test_batch_size: 256
  num_workers: 0

federated:
  num_rounds: 5
  clients_per_round: 5
  device: cpu

training:
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
  criterion: cross_entropy
  verbose: false

evaluation:
  frequency: 1
